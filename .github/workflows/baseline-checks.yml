name: Baseline syntax and synthetic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn pytest
      - name: Compile baseline and tests
        run: python -m compileall -q src tests
      - name: Run synthetic data tests (no private dataset)
        run: python -m pytest -q tests
